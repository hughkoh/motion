const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=v=>1-Math.pow(1-clamp(v),3);
function pop(v){v=clamp(v);return 1+2.70158*Math.pow(v-1,3)+1.70158*Math.pow(v-1,2)}
function text(s,x,y,size,color=C.ink,align='center',weight=900){ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${weight} ${size}px "Malgun Gothic", "Noto Sans KR", sans-serif`;ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circle(x,y,r,color,fill=false,w=2){ctx.beginPath();ctx.arc(x,y,Math.max(.01,r),0,Math.PI*2);ctx.lineWidth=w;ctx.strokeStyle=color;ctx.fillStyle=color;fill?ctx.fill():ctx.stroke()}
function word(s,x,y,size,color,b,delay=0,style='pop'){
 const e=pop((b-delay)/.85);if(b<delay)return;ctx.save();ctx.translate(x,y);ctx.globalAlpha=clamp((b-delay)*4);
 if(style==='slide'){ctx.translate((1-e)*-220,0)}else if(style==='rise'){ctx.translate(0,(1-e)*150)}else ctx.scale(Math.max(.001,e),Math.max(.001,e));
 const pulse=1+.022*Math.exp(-((b-delay)%1)*8);ctx.scale(pulse,pulse);text(s,0,0,size,color);ctx.restore();
}
function label(s,x,y,color=C.muted,align='left'){text(s,x,y,24,color,align,500)}
function chrome(i,b,dark){const fg=dark?'#e6e9ec':C.ink,mut=dark?'#7d8b96':'#859098';label('SEKI  /  CONTROLS',90,70,fg);label('THERMAL PROTECTION',1830,70,mut,'right');line(90,116,1830,116,dark?'#ffffff20':'#101b2725');label(`0${i+1}  /  08`,90,1005,mut);label('SINCE 1980',1830,1005,mut,'right');for(let k=0;k<8;k++){ctx.fillStyle=k<=i?C.red:(dark?'#ffffff20':'#101b2720');ctx.fillRect(720+k*62,1000,k===i?42:28,5)}}
function rays(x,y,b,color){ctx.save();ctx.translate(x,y);ctx.rotate(b*.08);for(let j=0;j<12;j++){ctx.rotate(Math.PI/6);line(0,230,0,260+10*Math.sin(b*2+j),color,5)}ctx.restore()}
function heat(b){for(let j=0;j<4;j++){ctx.beginPath();for(let k=0;k<=70;k++){let y=230+k*9,x=1570+j*65+Math.sin(k*.17-b*2+j)*23;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='#f9533450';ctx.lineWidth=5;ctx.stroke()}}
function render(t){
 const idx=Math.min(7,Math.floor(t/SCENE)),local=t-idx*SCENE,b=local/BEAT,beat=t/BEAT;

// A fully original 30-second electro-pop score, synthesized locally in Web Audio.
// 64 beats at 128 BPM; C major / Am, with drums, bass, plucks and bright chords.
function createMusic(ac){
 const sr=ac.sampleRate,n=Math.ceil(DURATION*sr),buf=ac.createBuffer(2,n,sr),L=buf.getChannelData(0),R=buf.getChannelData(1);
 let seed=1980;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/2147483648-1};
 function add(at,dur,fn,pan=0){const s=Math.round(at*sr),len=Math.min(Math.floor(dur*sr),n-s);for(let k=0;k<len;k++){const v=fn(k/sr,k);L[s+k]+=v*(1-pan*.3);R[s+k]+=v*(1+pan*.3)}}
 const hz=m=>440*2**((m-69)/12),roots=[48,43,45,41],chords=[[60,64,67,71],[59,62,67,69],[60,64,69,71],[60,64,65,69]];
 for(let b=0;b<64;b++){
   const at=b*BEAT,bar=Math.floor(b/4),root=roots[Math.floor(bar/2)%4];
   add(at,.31,t=>{const f=45+100*Math.exp(-t*32);return Math.sin(2*Math.PI*(45*t+100/32*(1-Math.exp(-t*32))))*.48*Math.exp(-t*19)});
   if(b%2===1)add(at,.16,t=>{const noise=rand();return (noise*.23+Math.sin(2*Math.PI*185*t)*.12)*Math.exp(-t*27)});
   for(let half=0;half<2;half++)add(at+half*BEAT/2,.055,t=>rand()*.057*Math.exp(-t*85),half?.5:-.5);
   for(let off of [0,.5,.75])add(at+off*BEAT,.24,t=>{let f=hz(root-12);return (Math.sin(2*Math.PI*f*t)+.22*Math.sin(4*Math.PI*f*t))*.15*Math.min(1,t/.006)*Math.exp(-t*13)});
   if(b%2===0)for(const [j,m] of chords[Math.floor(bar/2)%4].entries())add(at+.035*j,.65,t=>(Math.sin(2*Math.PI*hz(m)*t)+.15*Math.sin(4*Math.PI*hz(m)*t))*.038*Math.min(1,t/.006)*Math.exp(-t*5),j%2?.6:-.6);
   const melody=[76,79,83,79,74,79,81,79,76,81,84,83,77,81,84,81];
   if(b%2===0||b>=48){const m=melody[b%16];for(const [delay,vol] of [[0,1],[BEAT*.75,.26]])add(at+delay,.55,t=>(Math.sin(2*Math.PI*hz(m)*t)+.25*Math.sin(2*Math.PI*hz(m)*2*t))*.083*vol*Math.min(1,t/.004)*Math.exp(-t*9),b%2?.4:-.4)}
 }
 let peak=0;for(let i=0;i<n;i++){const t=i/sr,e=Math.min(1,t/.04)*Math.min(1,(DURATION-t)/.5);L[i]*=e;R[i]*=e;peak=Math.max(peak,Math.abs(L[i]),Math.abs(R[i]))}for(let i=0;i<n;i++){L[i]*=.88/peak;R[i]*=.88/peak}return buf;
}
async function initAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=muted?0:.72;gain.connect(audio.destination);buffer=createMusic(audio)}await audio.resume()}
function stopSource(){if(source){try{source.stop()}catch{}source.disconnect();source=null}}
function syncSound(){stopSource();if(playing&&position<DURATION){source=audio.createBufferSource();source.buffer=buffer;source.connect(gain);source.start(0,position)}}
async function play(){if(playing)return;if(position>=DURATION)position=0;await initAudio();playing=true;origin=audio.currentTime-position;syncSound();$('cover').hidden=true;$('play').textContent='Ⅱ 일시정지'}
function pause(){if(playing)position=clamp(audio.currentTime-origin,0,DURATION);playing=false;stopSource();$('play').textContent='▶ 재생'}
function seek(v){position=clamp(v,0,DURATION);if(playing){origin=audio.currentTime-position;syncSound()}render(position);update()}
function update(){const sec=Math.floor(position);$('time').value=`00:${String(sec).padStart(2,'0')} / 00:30`;$('seek').value=position}
function tick(){if(playing){position=Math.min(DURATION,audio.currentTime-origin);if(position>=DURATION){pause();position=DURATION}}render(position);update();requestAnimationFrame(tick)}
$('start').onclick=play;$('play').onclick=()=>playing?pause():play();$('restart').onclick=async()=>{pause();position=0;await play()};$('seek').oninput=e=>seek(Number(e.target.value));
$('mute').onclick=()=>{muted=!muted;if(gain)gain.gain.setTargetAtTime(muted?0:.72,audio.currentTime,.025);$('mute').textContent=muted?'♪ 음악 꺼짐':'♪ 음악 켜짐';$('mute').setAttribute('aria-pressed',String(muted))};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('screen').requestFullscreen?.()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.code==='Space'){e.preventDefault();playing?pause():play()}if(e.code==='ArrowRight')seek(position+1);if(e.code==='ArrowLeft')seek(position-1)});
window.motionPreview={seek:t=>{pause();$('cover').hidden=true;seek(t)},getState:()=>({position,playing,duration:DURATION,bpm:BPM})};
requestAnimationFrame(tick);
